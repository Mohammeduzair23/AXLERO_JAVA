# Local development profile (default).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dashboard_builder}
    username: ${DB_USERNAME:dashboard_user}
    password: ${DB_PASSWORD}       # no default on purpose: comes from .env
    hikari:
      maximum-pool-size: 10

  jpa:
    show-sql: false

logging:
  level:
    com.axlero: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoint:
    health:
      show-details: always