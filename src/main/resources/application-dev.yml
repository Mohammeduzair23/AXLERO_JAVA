# Development-only settings. Secrets come from the git-ignored .env file.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update   # dev only: Hibernate generates the schema from the entities

app:
  jwt:
    secret: ${JWT_SECRET}                          # at least 32 characters
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}    # 1 hour