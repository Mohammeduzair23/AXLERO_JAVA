# Settings shared by every environment.
# Environment-specific values live in application-dev.yml (and a future application-prod.yml).

spring:
  application:
    name: dashboard-builder

  # Local development reads secrets from a git-ignored ".env" file in the project root.
  # "optional:" means startup does not fail if the file is absent
  # (e.g. in production, where real environment variables are used).
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false            # avoid lazy-loading surprises in controllers
    hibernate:
      ddl-auto: validate           # production expects the schema to already exist; dev overrides this
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2s                  # fail fast if Redis is down; the cache error handler then falls back to the database
      connect-timeout: 2s

app:
  cache:
    metrics-ttl-minutes: 5         # widget data is cached this long (and cleared whenever sales data is imported)

server:
  port: ${SERVER_PORT}
  shutdown: graceful               # finish in-flight requests on shutdown

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true